stages:
  - build

variables:
  BLOSSOM_REPO_URL: "https://repo.blossomos.org/rpm/"
  COSIGN_PASSWORD: ""
  GITHUB_TOKEN: ""

.build_base:
  stage: build
  tags:
    - bigboi
  before_script:
    - cp "$COSIGN_PRIVATE_KEY" cosign.key
    - echo "$CI_REGISTRY_PASSWORD" | podman login registry.blossomos.org -u "$CI_REGISTRY_USER" --password-stdin
  after_script:
    # sudo ./build.sh runs fetch-plasma-rpms as root, leaving plasma-rpms/
    # root-owned on disk. Chown it back to the runner's own user (rather than
    # deleting it) so the next job's unprivileged git checkout can clean the
    # workspace, while keeping the cache so fetch-plasma-rpms can skip
    # re-downloading ~600MB when the pin hasn't changed.
    - sudo chown -R "$(id -u):$(id -g)" plasma-rpms 2>/dev/null || true
    - sudo podman system prune -af

# latest (main branch + schedule + manual)

build-generic-latest:
  extends: .build_base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_BRANCH != "prerelease" && $CI_COMMIT_BRANCH != "release" && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
  script:
    - sudo BLOSSOM_REPO_URL="https://repo.blossomos.org/rpm-testing/" ./build.sh latest generic

build-nvidia-latest:
  extends: .build_base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_BRANCH != "prerelease" && $CI_COMMIT_BRANCH != "release" && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
  script:
    - sudo BLOSSOM_REPO_URL="https://repo.blossomos.org/rpm-testing/" ./build.sh latest nvidia

build-nvidia-legacy-latest:
  extends: .build_base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_BRANCH != "prerelease" && $CI_COMMIT_BRANCH != "release" && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
  script:
    - sudo BLOSSOM_REPO_URL="https://repo.blossomos.org/rpm-testing/" ./build.sh latest nvidia-legacy

# prerelease

build-generic-prerelease:
  extends: .build_base
  rules:
    - if: '$CI_COMMIT_BRANCH == "prerelease" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
  script:
    - sudo BLOSSOM_REPO_URL="https://repo.blossomos.org/rpm-testing/" ./build.sh prerelease generic

build-nvidia-prerelease:
  extends: .build_base
  rules:
    - if: '$CI_COMMIT_BRANCH == "prerelease" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
  script:
    - sudo BLOSSOM_REPO_URL="https://repo.blossomos.org/rpm-testing/" ./build.sh prerelease nvidia

build-nvidia-legacy-prerelease:
  extends: .build_base
  rules:
    - if: '$CI_COMMIT_BRANCH == "prerelease" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
  script:
    - sudo BLOSSOM_REPO_URL="https://repo.blossomos.org/rpm-testing/" ./build.sh prerelease nvidia-legacy

# release

build-generic-release:
  extends: .build_base
  rules:
    - if: '$CI_COMMIT_BRANCH == "release" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "schedule")'
  script:
    - sudo ./build.sh main generic

build-nvidia-release:
  extends: .build_base
  rules:
    - if: '$CI_COMMIT_BRANCH == "release" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "schedule")'
  script:
    - sudo ./build.sh main nvidia

build-nvidia-legacy-release:
  extends: .build_base
  rules:
    - if: '$CI_COMMIT_BRANCH == "release" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "schedule")'
  script:
    - sudo ./build.sh main nvidia-legacy
