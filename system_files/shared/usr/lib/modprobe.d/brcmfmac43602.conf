# Broadcom BCM43602 (MacBookPro13,x and 14,x): linux-firmware ships no board
# NVRAM for this chip, which leaves it with a weak signal, a placeholder MAC
# address and failing associations. The helper writes a board NVRAM with the
# Mac's own MAC address into /run before the driver loads, and keeps 5 GHz by
# undoing feature_disable from brcmfmac.conf on this chip only. Other chips
# load unchanged.
install brcmfmac /usr/libexec/blossomos/brcmfmac43602-nvram; /usr/sbin/modprobe --ignore-install brcmfmac $CMDLINE_OPTS $(cat /run/blossomos-brcmfmac43602/options 2>/dev/null)
