# Broadcom BCM43602 (MacBookPro13,x and 14,x): the driver loads unchanged by
# default. When blossomos-brcmfmac43602.service finds that a saved network in
# range does not connect, it picks the next variant (feature_disable=0, then a
# board NVRAM with the Mac's own MAC address) and remembers the one that works
# in /etc/blossomos/brcmfmac43602. This helper applies that choice before the
# driver loads. Other chips load unchanged.
install brcmfmac /usr/libexec/blossomos/brcmfmac43602-nvram; /usr/sbin/modprobe --ignore-install brcmfmac $CMDLINE_OPTS $(cat /run/blossomos-brcmfmac43602/options 2>/dev/null)
